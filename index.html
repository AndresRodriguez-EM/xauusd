<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="XAUUSD"/>
<meta name="theme-color" content="#080C14"/>
<title>XAUUSD Journal</title>
<link rel="manifest" href="manifest.json"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#080C14;--surface:#0D1421;--card:#111827;--border:#1F2D42;
  --gold:#F5A623;--gold2:#FFCC60;--green:#22C55E;--green-dim:#14532D;
  --red:#EF4444;--red-dim:#450A0A;--slate:#64748B;--muted:#94A3B8;
  --text:#E2E8F0;--white:#F8FAFC;--blue:#818CF8;
  --radius:14px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Syne',sans-serif}
#root{height:100dvh;display:flex;flex-direction:column;max-width:460px;margin:0 auto;position:relative;overflow:hidden}

/* ── HEADER ── */
.hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 10px;
  background:linear-gradient(180deg,rgba(245,166,35,.08) 0%,transparent 100%);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.hdr-logo{display:flex;align-items:center;gap:8px}
.hdr-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.3)}}
.hdr-title{font-size:17px;font-weight:800;letter-spacing:2px;color:var(--white)}
.hdr-sub{font-size:9px;letter-spacing:3px;color:var(--slate);font-family:'JetBrains Mono',monospace;text-transform:uppercase}
.hdr-total{text-align:right}
.hdr-total-lbl{font-size:9px;letter-spacing:2px;color:var(--slate);font-family:'JetBrains Mono',monospace}
.hdr-total-val{font-size:18px;font-weight:700;font-family:'JetBrains Mono',monospace;transition:color .3s}
.hdr-total-sub{font-size:9px;color:var(--slate);font-family:'JetBrains Mono',monospace;margin-top:1px}

/* ── TABS ── */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.tab{flex:1;padding:11px 0;background:transparent;border:none;color:var(--slate);font-size:11px;font-weight:600;cursor:pointer;font-family:'Syne',sans-serif;letter-spacing:.5px;border-bottom:2px solid transparent;transition:all .2s}
.tab.on{color:var(--gold);border-bottom:2px solid var(--gold)}

/* ── SCROLL AREA ── */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}

/* ── MONTH NAV ── */
.mnav{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}
.mnav-btn{width:36px;height:36px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.mnav-btn:active{transform:scale(.92);background:var(--border)}
.mnav-center{text-align:center}
.mnav-month{font-size:22px;font-weight:800;color:var(--white);letter-spacing:1px}
.mnav-year{font-size:11px;color:var(--slate);font-family:'JetBrains Mono',monospace;letter-spacing:2px}

/* ── STRIP ── */
.strip{display:flex;margin:0 14px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.strip-item{flex:1;padding:10px 4px;text-align:center}
.strip-item+.strip-item{border-left:1px solid var(--border)}
.strip-val{font-size:14px;font-weight:700;font-family:'JetBrains Mono',monospace}
.strip-lbl{font-size:8px;letter-spacing:1.5px;color:var(--slate);margin-top:2px;text-transform:uppercase}

/* ── CALENDAR ── */
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);padding:0 14px;margin-bottom:3px}
.cal-dh{text-align:center;font-size:9px;font-weight:700;color:var(--slate);letter-spacing:1px;padding:3px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 14px}
.day-cell{
  aspect-ratio:1;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;
  transition:transform .12s,border-color .12s;position:relative;overflow:hidden;
}
.day-cell:active{transform:scale(.9)}
.day-cell.empty{background:transparent;border-color:transparent;cursor:default;pointer-events:none}
.day-cell.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.day-cell.win{background:var(--green-dim);border-color:#166534}
.day-cell.loss{background:var(--red-dim);border-color:#7F1D1D}
.day-cell.be{background:#1E293B;border-color:#334155}
.day-num{font-size:11px;font-weight:700;color:var(--muted);font-family:'JetBrains Mono',monospace}
.day-pnl{font-size:8px;font-weight:600;margin-top:1px;font-family:'JetBrains Mono',monospace}
.day-add{font-size:15px;color:var(--border);margin-top:-1px}
.day-cell.today .day-num{color:var(--gold)}
.day-badge{position:absolute;top:2px;right:3px;font-size:7px;font-weight:700;color:var(--gold);font-family:'JetBrains Mono',monospace;background:rgba(245,166,35,.15);border-radius:6px;padding:0 3px}
.day-wd{position:absolute;top:1px;left:3px;font-size:8px;line-height:1}

/* ── STATS VIEW ── */
.stats-wrap{padding:14px}
.stats-section{font-size:10px;letter-spacing:2px;color:var(--slate);margin:14px 0 8px;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.stats-section:first-child{margin-top:0}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 6px;text-align:center}
.stat-icon{font-size:16px;margin-bottom:4px}
.stat-val{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace}
.stat-lbl{font-size:9px;color:var(--slate);margin-top:2px;letter-spacing:.5px}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:6px}
.chart-lbl{font-size:10px;letter-spacing:2px;color:var(--slate);margin-bottom:10px;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.bars{display:flex;align-items:flex-end;gap:2px;height:64px}
.bar-w{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bar{width:100%;border-radius:2px 2px 0 0;transition:height .4s cubic-bezier(.34,1.56,.64,1);min-width:2px}
.bar-n{font-size:7px;color:var(--slate);margin-top:2px}
.trade-list{display:flex;flex-direction:column;gap:6px}
.trade-row{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;gap:10px;cursor:pointer;transition:opacity .15s}
.trade-row:active{opacity:.7}
.trade-d{font-size:11px;color:var(--slate);min-width:36px;font-family:'JetBrains Mono',monospace}
.trade-n{flex:1;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trade-p{font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace}
.empty-list{text-align:center;color:var(--border);padding:28px;font-size:12px;letter-spacing:1px}
/* session table */
.sess-tbl{display:flex;flex-direction:column;gap:6px}
.sess-row{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;gap:8px}
.sess-name{flex:1;font-size:12px;font-weight:700;color:var(--text)}
.sess-metric{text-align:center;min-width:50px}
.sess-mv{font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace}
.sess-ml{font-size:7px;color:var(--slate);letter-spacing:.5px;text-transform:uppercase}
/* goal bar */
.goal-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:6px}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.goal-t{font-size:11px;color:var(--muted);font-weight:600}
.goal-v{font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace}
.goal-track{height:9px;background:var(--surface);border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.goal-fill{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.34,1.4,.64,1)}
.warn{background:var(--red-dim);border:1px solid #7F1D1D;border-radius:var(--radius-sm);padding:10px 12px;font-size:11px;color:#FCA5A5;margin-bottom:6px;display:flex;gap:8px;align-items:center}
/* equity svg */
.eq-svg{width:100%;height:120px;display:block}

/* ── SETTINGS ── */
.set-wrap{padding:14px}
.set-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.set-card h3{font-size:12px;color:var(--white);font-weight:800;margin-bottom:4px;letter-spacing:.5px}
.set-card p{font-size:10px;color:var(--slate);line-height:1.5;margin-bottom:10px}
.set-field{margin-bottom:10px}
.set-lbl{font-size:9px;letter-spacing:1.5px;color:var(--slate);margin-bottom:5px;display:block;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.set-inp{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--white);font-size:15px;padding:11px 12px;font-weight:700;font-family:'JetBrains Mono',monospace;outline:none}
.set-btn{width:100%;padding:12px 0;border-radius:var(--radius-sm);font-size:12px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;letter-spacing:.5px;border:1px solid var(--border);background:var(--surface);color:var(--text);margin-top:2px;transition:transform .12s}
.set-btn:active{transform:scale(.98)}
.set-btn.gold{background:var(--gold);color:#080C14;border:none}
.set-btn.danger{background:var(--red-dim);color:var(--red);border-color:#7F1D1D}
.set-btn-row{display:flex;gap:8px}
.set-btn-row .set-btn{flex:1}
.set-info{font-size:9px;color:var(--slate);text-align:center;padding:6px;font-family:'JetBrains Mono',monospace;letter-spacing:1px}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-end;z-index:200;backdrop-filter:blur(4px)}
.modal{
  width:100%;max-width:460px;margin:0 auto;
  background:var(--surface);border-radius:24px 24px 0 0;padding:0 20px 30px;
  border:1px solid var(--border);border-bottom:none;
  animation:slideUp .25s cubic-bezier(.34,1.56,.64,1);
  max-height:92dvh;overflow-y:auto;
}
.modal::-webkit-scrollbar{display:none}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 16px}
.modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-title{font-size:16px;font-weight:800;color:var(--white)}
.modal-close{width:30px;height:30px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
/* day trade list inside modal */
.mday-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.mday-item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 10px;cursor:pointer}
.mday-item.sel{border-color:var(--gold)}
.mday-tag{font-size:8px;font-weight:700;padding:2px 6px;border-radius:5px;font-family:'JetBrains Mono',monospace;letter-spacing:.5px}
.tag-lon{background:rgba(129,140,248,.15);color:var(--blue)}
.tag-ny{background:rgba(245,166,35,.15);color:var(--gold)}
.tag-none{background:var(--border);color:var(--muted)}
.mday-dir{font-size:10px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mday-p{font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace}
.mday-del{width:24px;height:24px;background:transparent;border:none;color:var(--slate);font-size:13px;cursor:pointer}
.form-title{font-size:10px;letter-spacing:1.5px;color:var(--gold);margin-bottom:10px;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.type-row{display:flex;gap:8px;margin-bottom:12px}
.type-btn{
  flex:1;padding:11px 0;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);color:var(--slate);font-size:12px;font-weight:700;
  cursor:pointer;font-family:'Syne',sans-serif;letter-spacing:.5px;transition:all .15s;
}
.type-btn.win-on{background:#052E16;border-color:#166534;color:var(--green)}
.type-btn.loss-on{background:var(--red-dim);border-color:#7F1D1D;color:var(--red)}
.mode-row{display:flex;gap:8px;margin-bottom:12px}
.mode-btn{flex:1;padding:10px 0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--slate);font-size:12px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;transition:all .15s}
.mode-btn.on{background:var(--surface);border-color:var(--gold);color:var(--gold)}
.field{margin-bottom:12px}
.field-row{display:flex;gap:8px}
.field-row .field{flex:1}
.field-lbl{font-size:9px;letter-spacing:2px;color:var(--slate);margin-bottom:6px;display:block;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.field-wrap{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.field-pre{padding:0 12px;color:var(--slate);font-size:16px;font-family:'JetBrains Mono',monospace}
.field-inp{
  flex:1;background:transparent;border:none;outline:none;color:var(--white);
  font-size:19px;padding:12px 12px 12px 0;font-weight:700;
  font-family:'JetBrains Mono',monospace;min-width:0;
}
.field-inp::placeholder{color:var(--border)}
.seg{display:flex;gap:6px}
.seg-btn{flex:1;padding:10px 0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--slate);font-size:11px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;transition:all .15s}
.seg-btn.on{background:var(--surface);border-color:var(--gold);color:var(--gold)}
.chk-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;margin-bottom:12px;cursor:pointer}
.chk-box{width:22px;height:22px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:all .15s}
.chk-box.on{background:var(--green);border-color:var(--green);color:#052E16}
.chk-lbl{font-size:12px;color:var(--text);font-weight:600}
.field-txt{
  width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);color:var(--text);font-size:13px;
  padding:12px;outline:none;resize:none;font-family:'Syne',sans-serif;
  line-height:1.5;
}
.field-txt::placeholder{color:var(--border)}
.modal-actions{display:flex;gap:8px;margin-top:4px}
.btn-save{
  flex:1;padding:14px 0;background:var(--gold);border:none;
  border-radius:var(--radius);color:#080C14;font-size:15px;font-weight:800;
  cursor:pointer;font-family:'Syne',sans-serif;letter-spacing:.5px;
  box-shadow:0 4px 20px rgba(245,166,35,.35);transition:transform .12s,box-shadow .12s;
}
.btn-save:active{transform:scale(.97);box-shadow:0 2px 10px rgba(245,166,35,.2)}
.hidden-file{display:none}
</style>

<body>
<div id="root"></div>
<input type="file" id="import-file" class="hidden-file" accept="application/json" onchange="onImportFile(event)"/>
<script>
// ── Storage keys ───────────────────────────────────────────────────────────
const SK  = "xauusd26";       // datos de operativas (se conserva para no perder tu historial)
const CFG = "xauusd_cfg";     // configuración (meta, límites, cuenta)
const WD  = "xauusd_wd";      // retiros de la cuenta de fondeo

// ── Migración: modelo antiguo (1 operativa/día) -> nuevo (varias/día) ───────
// Antiguo: trades[fecha] = {pnl, note, date}
// Nuevo:   trades[fecha] = {items:[{id,pnl,r,dir,session,followed,note}], date}
function migrate(raw){
  const out = {};
  for(const k in raw){
    const v = raw[k];
    if(!v) continue;
    if(Array.isArray(v.items)){ out[k] = v; continue; }
    if(typeof v.pnl === "number"){
      out[k] = { date:k, items:[{ id:uid(), pnl:v.pnl, r:null, dir:null, session:null, followed:null, note:v.note||"" }] };
    }
  }
  return out;
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

// ── State ───────────────────────────────────────────────────────────────────
const today = new Date();
let S = {
  year: today.getFullYear(), month: today.getMonth(),
  view: "cal", modal: null, editIdx: null, editWdIdx: null,
  form: { pnl:"", note:"", type:"win", dir:"", session:"", r:"", followed:true, mode:"trade" },
  trades: (()=>{ try{ return migrate(JSON.parse(localStorage.getItem(SK)||"{}")) }catch{ return {} } })(),
  wd: (()=>{ try{ return JSON.parse(localStorage.getItem(WD)||"{}") }catch{ return {} } })(),
  cfg: (()=>{ try{ return Object.assign({goal:0,maxLoss:0,account:0}, JSON.parse(localStorage.getItem(CFG)||"{}")) }catch{ return {goal:0,maxLoss:0,account:0} } })()
};
const save    = () => localStorage.setItem(SK, JSON.stringify(S.trades));
const saveWd  = () => localStorage.setItem(WD, JSON.stringify(S.wd));
const saveCfg = () => localStorage.setItem(CFG, JSON.stringify(S.cfg));

// ── Constants ─────────────────────────────────────────────────────────────
const MES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DIAS = ["D","L","M","X","J","V","S"];
const DIASL = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

// ── Helpers ───────────────────────────────────────────────────────────────
const dk = (y,m,d) => `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const dim = (y,m) => new Date(y,m+1,0).getDate();
const fd  = (y,m) => new Date(y,m,1).getDay();
const usd = v => {
  const n=parseFloat(v); if(isNaN(n)) return "$0.00";
  const abs=Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  return (n>=0?"+$":"-$")+abs;
};
const compact = n => {
  const a=Math.abs(n);
  if(a>=1000) return (n>0?"+":"-")+"$"+(a/1000).toFixed(1)+"k";
  return (n>0?"+":"-")+"$"+a.toFixed(0);
};
const dayItems = (y,m,d) => { const t=S.trades[dk(y,m,d)]; return t&&t.items?t.items:[]; };
const dayPnl   = (y,m,d) => dayItems(y,m,d).reduce((s,i)=>s+i.pnl,0);
const dayWd    = (y,m,d) => { const a=S.wd[dk(y,m,d)]; return a&&a.length?a:[]; };
const monthWd  = () => { const {year,month}=S; let s=0; const days=dim(year,month); for(let d=1;d<=days;d++) s+=dayWd(year,month,d).reduce((a,w)=>a+w.amount,0); return s; };
const totalWd  = () => Object.values(S.wd).reduce((s,a)=>s+(Array.isArray(a)?a.reduce((x,w)=>x+w.amount,0):0),0);

// ── Stats del mes ───────────────────────────────────────────────────────────
function monthStats(){
  const {year,month}=S;
  const days=dim(year,month);
  const flat=[];                       // operativas en orden cronológico
  for(let d=1;d<=days;d++){
    const wd=new Date(year,month,d).getDay();
    for(const it of dayItems(year,month,d)) flat.push({...it, day:d, wd});
  }
  const pnl=flat.reduce((s,t)=>s+t.pnl,0);
  const wins=flat.filter(t=>t.pnl>0).length;
  const loss=flat.filter(t=>t.pnl<0).length;
  const decided=wins+loss;
  const grossW=flat.filter(t=>t.pnl>0).reduce((s,t)=>s+t.pnl,0);
  const grossL=Math.abs(flat.filter(t=>t.pnl<0).reduce((s,t)=>s+t.pnl,0));
  // rachas
  let maxW=0,maxL=0,curW=0,curL=0;
  for(const t of flat){
    if(t.pnl>0){curW++;curL=0;maxW=Math.max(maxW,curW);}
    else if(t.pnl<0){curL++;curW=0;maxL=Math.max(maxL,curL);}
  }
  // equity + drawdown
  let eq=0,peak=0,maxDD=0; const curve=[0];
  for(const t of flat){ eq+=t.pnl; peak=Math.max(peak,eq); maxDD=Math.max(maxDD,peak-eq); curve.push(eq); }
  // por sesión
  const bySess={LON:{n:0,w:0,pnl:0},NY:{n:0,w:0,pnl:0},none:{n:0,w:0,pnl:0}};
  for(const t of flat){ const k=t.session||"none"; if(!bySess[k])bySess[k]={n:0,w:0,pnl:0}; bySess[k].n++; bySess[k].pnl+=t.pnl; if(t.pnl>0)bySess[k].w++; }
  // adherencia al plan
  const withFlag=flat.filter(t=>t.followed!==null&&t.followed!==undefined);
  const followed=withFlag.filter(t=>t.followed).length;
  // R
  const withR=flat.filter(t=>typeof t.r==="number"&&!isNaN(t.r));
  const sumR=withR.reduce((s,t)=>s+t.r,0);
  return {
    flat,pnl,wins,loss,trades:flat.length,
    wr:decided?Math.round(wins/decided*100):0,
    best:flat.length?Math.max(...flat.map(t=>t.pnl)):0,
    worst:flat.length?Math.min(...flat.map(t=>t.pnl)):0,
    avg:flat.length?pnl/flat.length:0,
    pf:grossL>0?grossW/grossL:(grossW>0?Infinity:0),
    maxW,maxL,maxDD,curve,bySess,
    adherence:withFlag.length?Math.round(followed/withFlag.length*100):null,
    sumR,avgR:withR.length?sumR/withR.length:null,hasR:withR.length>0
  };
}
const allPnL = () => Object.values(S.trades).reduce((s,t)=>s+(t.items?t.items.reduce((a,i)=>a+i.pnl,0):0),0);

function equitySVG(curve){
  const w=420,h=120,pad=6;
  const min=Math.min(...curve), max=Math.max(...curve);
  const range=(max-min)||1;
  const n=curve.length;
  const x=i=> n>1 ? pad+(i/(n-1))*(w-2*pad) : w/2;
  const y=v=> h-pad-((v-min)/range)*(h-2*pad);
  const zeroY=y(0);
  let d="";
  curve.forEach((v,i)=>{ const px=x(i).toFixed(1), py=y(v).toFixed(1); d+=(i?" L":"M")+px+" "+py; });
  const area = d + ` L ${x(n-1).toFixed(1)} ${h-pad} L ${x(0).toFixed(1)} ${h-pad} Z`;
  const end=curve[curve.length-1];
  const col=end>=0?"#22C55E":"#EF4444";
  return `<svg class="eq-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <line x1="0" y1="${zeroY.toFixed(1)}" x2="${w}" y2="${zeroY.toFixed(1)}" stroke="#1F2D42" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="${area}" fill="${col}" opacity="0.12"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

        <div class="chk-lbl">Seguí mi plan de trading</div>
      </div>
      <div class="field"><span class="field-lbl">Notas (opcional)</span>
        <textarea class="field-txt" rows="2" placeholder="Setup, confluencias, lecciones..." oninput="S.form.note=this.value">${esc(form.note)}</textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-save" onclick="saveItem()">${editIdx!==null?"✓ ACTUALIZAR":"✓ AGREGAR OPERATIVA"}</button>
      </div>`;
  }

  const formTitle = mode==="withdraw"
    ? (editWdIdx!==null?"✏️ Editar retiro":"💵 Nuevo retiro")
    : (editIdx!==null?"✏️ Editar operativa":"➕ Nueva operativa");

  return `<div class="overlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <div class="modal-top">
        <div class="modal-title">${dname} ${modal.day} · ${MES[month]}</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      ${items.length?`<div class="mday-list">${list}</div>`:""}
      ${wds.length?`<div class="mday-list">${wlist}</div>`:""}
      <div class="mode-row">
        <button class="mode-btn ${mode==="trade"?"on":""}" onclick="setMode('trade')">📈 Operativa</button>
        <button class="mode-btn ${mode==="withdraw"?"on":""}" onclick="setMode('withdraw')">💵 Retiro</button>
      </div>
      <div class="form-title">${formTitle}</div>
      ${formHtml}
    </div>
  </div>`;
}

// ── Actions ────────────────────────────────────────────────────────────────
function setView(v){S.view=v;render()}
function prevM(){S.month===0?(S.year--,S.month=11):S.month--;render()}
function nextM(){S.month===11?(S.year++,S.month=0):S.month++;render()}
function resetForm(mode){S.form={pnl:"",note:"",type:"win",dir:"",session:"",r:"",followed:true,mode:mode||"trade"};S.editIdx=null;S.editWdIdx=null;}
function openModal(d){ resetForm("trade"); S.modal={day:d,key:dk(S.year,S.month,d)}; render(); }
function closeModal(){S.modal=null;S.editIdx=null;S.editWdIdx=null;render()}
function setType(t){S.form.type=t;render()}
function setF(k,v){S.form[k]=S.form[k]===v?"":v;render()}
function setMode(m){resetForm(m);render()}
function editItem(idx){
  const day=S.trades[S.modal.key];
  const it=day&&day.items?day.items[idx]:null; if(!it)return;
  S.form={pnl:String(Math.abs(it.pnl)),note:it.note||"",type:it.pnl>=0?"win":"loss",
    dir:it.dir||"",session:it.session||"",r:(typeof it.r==="number")?String(Math.abs(it.r)):"",
    followed:it.followed!==false,mode:"trade"};
  S.editIdx=idx; S.editWdIdx=null; render();
}
function saveItem(){
  const p=parseFloat(S.form.pnl);
  if(!p||isNaN(p)){toast("Ingresa un monto válido");return}
  const sign=S.form.type==="loss"?-1:1;
  const pnl=sign*Math.abs(p);
  let r=parseFloat(S.form.r); r=isNaN(r)?null:sign*Math.abs(r);
  const item={ id:S.editIdx!==null?(S.trades[S.modal.key].items[S.editIdx].id):uid(),
    pnl, r, dir:S.form.dir||null, session:S.form.session||null, followed:!!S.form.followed, note:S.form.note.trim() };
  if(!S.trades[S.modal.key]) S.trades[S.modal.key]={date:S.modal.key,items:[]};
  if(S.editIdx!==null) S.trades[S.modal.key].items[S.editIdx]=item;
  else S.trades[S.modal.key].items.push(item);
  save(); resetForm("trade"); render();
  toast("Operativa guardada");
}
function delItem(idx){
  if(!confirm("¿Eliminar esta operativa?"))return;
  const day=S.trades[S.modal.key]; if(!day)return;
  day.items.splice(idx,1);
  if(!day.items.length) delete S.trades[S.modal.key];
  save(); if(S.editIdx===idx)resetForm("trade"); render();
}
// ── Retiros ──────────────────────────────────────────────────────────────
function saveWdItem(){
  const p=parseFloat(S.form.pnl);
  if(!p||isNaN(p)||p<=0){toast("Ingresa un monto válido");return}
  const item={ id:S.editWdIdx!==null?S.wd[S.modal.key][S.editWdIdx].id:uid(), amount:Math.abs(p), note:S.form.note.trim() };
  if(!S.wd[S.modal.key]) S.wd[S.modal.key]=[];
  if(S.editWdIdx!==null) S.wd[S.modal.key][S.editWdIdx]=item;
  else S.wd[S.modal.key].push(item);
  saveWd(); resetForm("withdraw"); render();
  toast("Retiro guardado");
}
function editWd(idx){
  const a=S.wd[S.modal.key]; const w=a&&a[idx]; if(!w)return;
  S.form={pnl:String(w.amount),note:w.note||"",type:"win",dir:"",session:"",r:"",followed:true,mode:"withdraw"};
  S.editWdIdx=idx; S.editIdx=null; render();
}
function delWd(idx){
  if(!confirm("¿Eliminar este retiro?"))return;
  const a=S.wd[S.modal.key]; if(!a)return;
  a.splice(idx,1);
  if(!a.length) delete S.wd[S.modal.key];
  saveWd(); if(S.editWdIdx===idx)resetForm("withdraw"); render();
}
function gotoDay(d){S.view="cal";render();setTimeout(()=>openModal(d),80)}

// ── Backup ──────────────────────────────────────────────────────────────────
function download(name,text,mime){
  const blob=new Blob([text],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function exportJSON(){
  const data={ app:"xauusd-journal", version:3, exported:new Date().toISOString(), cfg:S.cfg, trades:S.trades, withdrawals:S.wd };
  download(`xauusd-journal-${dk(S.year,S.month,new Date().getDate())}.json`, JSON.stringify(data,null,2), "application/json");
  toast("Respaldo JSON descargado");
}
function exportCSV(){
  const all=[];
  Object.keys(S.trades).forEach(k=>{
    ((S.trades[k]&&S.trades[k].items)||[]).forEach(t=>{
      all.push([k,"Operativa", t.session||"", t.dir==="buy"?"Compra":t.dir==="sell"?"Venta":"",
        t.pnl>=0?"Ganancia":"Perdida", t.pnl.toFixed(2), (typeof t.r==="number"?t.r:""),
        t.followed===true?"Si":t.followed===false?"No":"", (t.note||"").replace(/"/g,'""')]);
    });
  });
  Object.keys(S.wd).forEach(k=>{
    (S.wd[k]||[]).forEach(w=>{
      all.push([k,"Retiro","","","Retiro", (-Math.abs(w.amount)).toFixed(2), "", "", (w.note||"").replace(/"/g,'""')]);
    });
  });
  all.sort((a,b)=> a[0]<b[0]?-1:a[0]>b[0]?1:0);
  const rows=[["fecha","tipo","sesion","direccion","resultado","monto_usd","R","siguio_plan","nota"], ...all];
  const csv=rows.map(r=>r.map(c=>`"${c}"`).join(",")).join("\n");
  download(`xauusd-journal-${dk(S.year,S.month,new Date().getDate())}.csv`, "﻿"+csv, "text/csv");
  toast("Respaldo CSV descargado");
}
function onImportFile(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      const incoming = data.trades || data;   // acepta export nuevo o dump antiguo
      if(typeof incoming!=="object") throw 0;
      if(!confirm("Esto reemplazará tus datos actuales por los del respaldo. ¿Continuar?")) { e.target.value=""; return; }
      S.trades=migrate(incoming);
      if(data.withdrawals) S.wd=data.withdrawals;
      if(data.cfg) S.cfg=Object.assign({goal:0,maxLoss:0,account:0},data.cfg);
      save(); saveWd(); saveCfg(); render(); toast("Respaldo importado ✓");
    }catch(err){ alert("Archivo inválido. Debe ser un JSON exportado por esta app."); }
    e.target.value="";
  };
  reader.readAsText(file);
}
function wipeAll(){
  if(!confirm("¿Borrar TODO el historial de este dispositivo? No se puede deshacer."))return;
  if(!confirm("Confirma de nuevo: se eliminarán todas tus operativas y retiros."))return;
  S.trades={}; S.wd={}; save(); saveWd(); render(); toast("Historial borrado");
}

// ── Toast ─────────────────────────────────────────────────────────────────
let toastT;
function toast(msg){
  let el=document.getElementById("toast");
  if(!el){ el=document.createElement("div"); el.id="toast";
    el.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;border:1px solid #1F2D42;color:#E2E8F0;padding:10px 18px;border-radius:12px;font-size:13px;font-family:'Syne',sans-serif;z-index:300;box-shadow:0 6px 24px rgba(0,0,0,.5);transition:opacity .3s;max-width:90%;text-align:center";
    document.body.appendChild(el); }
  el.textContent=msg; el.style.opacity="1";
  clearTimeout(toastT); toastT=setTimeout(()=>el.style.opacity="0",1800);
}

// ── Service worker (offline) ────────────────────────────────────────────────
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

render();
</script>
